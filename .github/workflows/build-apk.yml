name: Build APK

on:
  push:
    branches: [ libre3-companion ]
  workflow_dispatch:
    inputs:
      side_by_side:
        description: "Install next to existing xDrip (package suffix .l3)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Use your own signing key if you add the secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD
      # (needed so later builds can update the app without uninstalling).
      # Without them a throwaway key is generated for this build only.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PW="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - using a one-off key. You will have to uninstall before installing a later build."
            PW="throwaway-$(date +%s)"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" \
              -alias xdrip -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xdripJH"
          fi
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=xdrip\nkeyPassword=%s\n" "$KS" "$PW" "$PW" > keystore.properties

      - name: Build
        run: |
          EXTRA=""
          if [ "${{ inputs.side_by_side }}" != "false" ]; then EXTRA="-PappIdSuffix=.l3"; fi
          ./gradlew :app:assembleProdRelease $EXTRA --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xdripJH-libre3-companion
          path: app/build/outputs/apk/prod/release/*.apk
